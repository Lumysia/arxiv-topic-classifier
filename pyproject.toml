[project]
name = "arxiv-topic-classifier"
version = "0.1.0"
description = "Leakage-safe arXiv abstract topic classification"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.8.0",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[project.urls]
Repository = "https://github.com/Lumysia/arxiv-topic-classifier"

[project.scripts]
arxiv-classifier = "arxiv_topic_classifier.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-flask>=1.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["data/raw", ".venv", ".lo-home", "slides", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["arxiv_topic_classifier"]
warn_unreachable = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "fastembed.*", "joblib.*"]
ignore_missing_imports = true
